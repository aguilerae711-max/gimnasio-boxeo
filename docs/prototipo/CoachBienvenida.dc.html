<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Coach · Bienvenida</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF6B76}a:hover{color:#FF8F97}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121317; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 13px; color: #A3A8B3">Bienvenido, Mike · {{numero}} de {{total}}</span>
    <a href="CoachHoy.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; color: #A3A8B3; text-decoration: none">Saltar</a>
  </div>

  <div style="margin-top: 18px; height: 300px; border-radius: 24px; background: #1C1E25; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden">
    <div style="position: absolute; width: 220px; height: 220px; border-radius: 110px; border: 26px solid {{color}}; opacity: 0.18"></div>
    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icono}}"></path></svg>
  </div>

  <div style="margin-top: 26px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: {{color}}">{{etiqueta}}</div>
  <h1 style="margin: 8px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 38px; line-height: 1; text-transform: uppercase">{{titulo}}</h1>
  <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.55; color: #C9CCD3">{{texto}}</p>

  <div style="margin-top: auto; display: flex; justify-content: center; gap: 8px">
    <sc-for list="{{puntos}}" as="p" hint-placeholder-count="4">
      <span style="width: {{p.w}}; height: 8px; border-radius: 4px; background: {{p.color}}"></span>
    </sc-for>
  </div>
  <div style="margin-top: 18px; display: flex; gap: 10px">
    <sc-if value="{{hayAtras}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{atras}}" style="min-height: 52px; padding: 0 20px; border-radius: 14px; border: 1px solid #3A3D46; background: transparent; color: #F2F3F5; font: 600 15px Inter, sans-serif">Atrás</button>
    </sc-if>
    <button type="button" onClick="{{siguiente}}" style="flex: 1; min-height: 52px; border-radius: 14px; border: 0; background: #D7263D; color: #FFFFFF; font: 700 16px Inter, sans-serif">{{textoSiguiente}}</button>
  </div>
  <div style="margin-top: 10px; text-align: center; font-size: 12px; color: #A3A8B3">Puedes volver a verla en Más → Ayuda</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { paso: 0 };
}
renderVals() {
const pasos = [
{ etiqueta: 'TUS TURNOS', titulo: 'Tu día empieza aquí', color: '#D7263D', icono: 'M12 6v6l4 2 M12 2a10 10 0 100 20 10 10 0 000-20z', texto: 'En Hoy ves tus turnos con la rutina que toca y los clientes que tienes en cada uno.' },
{ etiqueta: 'TUS CLIENTES', titulo: 'Invita y acompaña', color: '#E8B04B', icono: 'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 3a4 4 0 100 8 4 4 0 000-8z M23 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75', texto: 'Comparte tu invitación. Verás quién está activo, a quién le vence y sus resultados por pilar.' },
{ etiqueta: 'PAGOS Y COMISIÓN', titulo: 'Reporta en 3 toques', color: '#3DBE7A', icono: 'M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z M12 9a4 4 0 100 8 4 4 0 000-8z', texto: 'Toma foto del comprobante y envíalo. Cuando la administración lo confirma, se suma tu comisión.' },
{ etiqueta: 'TU PLAN', titulo: 'Un plan por turno', color: '#4FA3FF', icono: 'M3 4h18v18H3z M16 2v4 M8 2v4 M3 10h18', texto: 'Arma tu plan del mes con ejercicios del glosario y la biblioteca. Puedes dejarlo fijo y solo cambiar lo necesario.' }
];
const s = this.state;
const p = pasos[s.paso];
const ultimo = s.paso === pasos.length - 1;
return Object.assign({}, p, {
numero: s.paso + 1,
total: pasos.length,
puntos: pasos.map((x, i) => ({ w: i === s.paso ? '26px' : '8px', color: i === s.paso ? p.color : '#2A2D36' })),
hayAtras: s.paso > 0,
atras: () => this.setState({ paso: s.paso - 1 }),
siguiente: () => this.setState({ paso: ultimo ? 0 : s.paso + 1 }),
textoSiguiente: ultimo ? 'Empezar' : 'Siguiente'
});
}
}
</script>
</body>
</html>
