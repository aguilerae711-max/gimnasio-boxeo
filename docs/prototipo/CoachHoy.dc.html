<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Coach · Hoy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF6B76}a:hover{color:#FF8F97}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121317; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 0">
    <div style="font-size: 13px; color: #A3A8B3">Lunes 2 de noviembre</div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; text-transform: uppercase">Hoy, Coach Iván</div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{turnos}}" as="t" hint-placeholder-count="2">
      <div style="background: #1C1E25; border-radius: 18px; padding: 16px; display: flex; gap: 14px; align-items: center">
        <div style="width: 74px; flex-shrink: 0; border-radius: 12px; background: {{t.bg}}; padding: 8px 0; text-align: center">
          <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; line-height: 1; color: {{t.fg}}">{{t.ini}}</div>
          <div style="font-size: 12px; color: {{t.fg}}">a {{t.fin}}</div>
        </div>
        <div style="min-width: 0; flex: 1">
          <div style="font-size: 12px; color: #A3A8B3">{{t.estado}}</div>
          <div style="font-size: 16px; font-weight: 600">{{t.rutina}}</div>
          <div style="margin-top: 2px; font-size: 13px; color: #C9CCD3">{{t.clientes}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; text-transform: uppercase">Atención</span>
    <a href="CoachClientes.dc.html" style="font-size: 13px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Ver clientes</a>
  </div>
  <div style="margin: 0 20px; background: #1C1E25; border-radius: 16px; overflow: hidden">
    <sc-for list="{{alertas}}" as="a" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #23262E">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: {{a.dot}}; flex-shrink: 0"></span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 600">{{a.nombre}}</div>
          <div style="font-size: 12px; color: #A3A8B3">{{a.detalle}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px 20px 0">
    <button type="button" style="width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: #D7263D; color: #FFFFFF; font: 700 16px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      Reportar pago
    </button>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #23262E; background: #16171C; padding: 8px 6px 14px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <a href="{{n.href}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11px; font-weight: 600">
        <span style="width: 22px; height: 4px; border-radius: 2px; background: {{n.bar}}"></span>{{n.label}}
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = (l, h) => ({ label: l, href: h, color: '#F2F3F5', bar: '#D7263D' });
const off = (l, h) => ({ label: l, href: h, color: '#A3A8B3', bar: 'transparent' });
return {
turnos: [
{ ini: '08:00', fin: '10:00', estado: 'En curso', rutina: 'A · Técnica y saco', clientes: '8 clientes', bg: '#D7263D', fg: '#FFFFFF' },
{ ini: '18:00', fin: '20:00', estado: 'Siguiente', rutina: 'A · Técnica y saco', clientes: '6 clientes', bg: '#2A2D36', fg: '#F2F3F5' }
],
alertas: [
{ nombre: 'Luis Gómez', detalle: 'Membresía vencida hace 2 días', dot: '#FF5A66' },
{ nombre: 'Ana Ruiz', detalle: 'Vence en 3 días', dot: '#E8B04B' },
{ nombre: 'Pedro Díaz', detalle: 'Pago en revisión por administración', dot: '#4FA3FF' }
],
nav: [on('Hoy', 'CoachHoy.dc.html'), off('Mi plan', 'CoachPlan.dc.html'), off('Clientes', 'CoachClientes.dc.html'), off('Biblioteca', 'CoachBiblioteca.dc.html'), off('Más', 'CoachHoy.dc.html')]
};
}
}
</script>
</body>
</html>
