<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cliente · Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF6B76}a:hover{color:#FF8F97}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121317; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <div>
      <div style="font-size: 13px; color: #A3A8B3">Viernes 30 de octubre</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; text-transform: uppercase">Hola, Juan</div>
    </div>
    <button type="button" aria-label="Notificaciones" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1C1E25; color: #F2F3F5; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 003.4 0"></path></svg>
    </button>
  </div>

  <div style="margin: 18px 20px 0; border-radius: 22px; background: #1C1E25; padding: 22px; display: flex; align-items: center; gap: 20px">
    <div style="position: relative; width: 132px; height: 132px; flex-shrink: 0">
      <svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="18 de 30 días restantes">
        <circle cx="66" cy="66" r="56" fill="none" stroke="#2A2D36" stroke-width="12"></circle>
        <circle cx="66" cy="66" r="56" fill="none" stroke="#3DBE7A" stroke-width="12" stroke-linecap="round" stroke-dasharray="211 352" transform="rotate(-90 66 66)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 46px; line-height: 1">18</div>
        <div style="font-size: 12px; color: #A3A8B3">días restantes</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px; background: #173A28; color: #6FE0A2; font-size: 12px; font-weight: 700; letter-spacing: 1px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #3DBE7A"></span>ACTIVO</span>
      <div>
        <div style="font-size: 12px; color: #A3A8B3">Vence</div>
        <div style="font-size: 16px; font-weight: 600">18 nov 2026</div>
      </div>
      <div>
        <div style="font-size: 12px; color: #A3A8B3">Plan</div>
        <div style="font-size: 16px; font-weight: 600">Mensual</div>
      </div>
    </div>
  </div>

  <div style="margin: 12px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="background: #1C1E25; border-radius: 16px; padding: 14px">
      <div style="font-size: 12px; color: #A3A8B3">Mi coach</div>
      <div style="margin-top: 4px; font-size: 16px; font-weight: 600">Coach Iván</div>
      <div style="margin-top: 2px; font-size: 13px; color: #C9CCD3">L · M · V</div>
    </div>
    <div style="background: #1C1E25; border-radius: 16px; padding: 14px">
      <div style="font-size: 12px; color: #A3A8B3">Mi turno</div>
      <div style="margin-top: 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.1">18:00–20:00</div>
    </div>
  </div>

  <div style="margin: 12px 20px 0; background: #1C1E25; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px">
    <div style="width: 44px; height: 44px; border-radius: 12px; background: #3A1A20; display: flex; align-items: center; justify-content: center; color: #FF6B76; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
    </div>
    <div style="min-width: 0">
      <div style="font-size: 12px; color: #A3A8B3">Hoy en tu turno</div>
      <div style="font-size: 15px; font-weight: 600">Técnica y saco</div>
    </div>
  </div>

  <a href="ClienteResultados.dc.html" style="margin: 12px 20px 0; background: #1C1E25; border-radius: 16px; padding: 14px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #F2F3F5">
    <div>
      <div style="font-size: 12px; color: #A3A8B3">Mis resultados · Octubre</div>
      <div style="margin-top: 6px; display: flex; gap: 14px">
        <sc-for list="{{pilares}}" as="p" hint-placeholder-count="4">
          <div style="text-align: center">
            <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; color: {{p.color}}">{{p.v}}</div>
            <div style="font-size: 11px; color: #A3A8B3">{{p.n}}</div>
          </div>
        </sc-for>
      </div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3A8B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
  </a>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #23262E; background: #16171C; padding: 8px 8px 14px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <a href="{{n.href}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11px; font-weight: 600">
        <span style="width: 22px; height: 4px; border-radius: 2px; background: {{n.bar}}"></span>{{n.label}}
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = (l, h) => ({ label: l, href: h, color: '#F2F3F5', bar: '#D7263D' });
const off = (l, h) => ({ label: l, href: h, color: '#A3A8B3', bar: 'transparent' });
return {
pilares: [
{ n: 'Fuerza', v: 112, color: '#FF6B76' },
{ n: 'Velocidad', v: 115, color: '#E8B04B' },
{ n: 'Resist.', v: 121, color: '#4FA3FF' },
{ n: 'Estrat.', v: 104, color: '#6FE0A2' }
],
nav: [on('Inicio', 'ClienteInicio.dc.html'), off('Resultados', 'ClienteResultados.dc.html'), off('Novedades', 'ClienteInicio.dc.html'), off('Perfil', 'ClienteInicio.dc.html')]
};
}
}
</script>
</body>
</html>
